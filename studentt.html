<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>玩家咨询 · 日语口头应答</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  background: #eef5fb;
  color: #213e58;
  font-family: "Microsoft YaHei", "Noto Sans JP", sans-serif;
  font-size: 24px;
  line-height: 1.7;
}

button { font: inherit; }

main {
  max-width: 1000px;
  margin: auto;
  padding: 36px 20px;
}

header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 16px;
  margin-bottom: 24px;
}

h1, h2, p { margin: 0; }
h1, h2 { font-size: 24px; }

.badge {
  padding: 5px 16px;
  border: 1px solid #ccdeed;
  border-radius: 30px;
  background: white;
  color: #356b94;
}

.progress {
  height: 8px;
  background: #dce9f4;
  border-radius: 10px;
  overflow: hidden;
  margin-bottom: 28px;
}

#progressBar {
  height: 100%;
  background: #247bbb;
  transition: width .25s;
}

.card {
  background: white;
  border: 1px solid #dce7f0;
  border-radius: 18px;
  padding: 32px;
  box-shadow: 0 12px 32px #1a446b09;
}

.player {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 24px;
  color: #336382;
}

.avatar {
  width: 50px;
  height: 50px;
  border-radius:  50%;
  background: #e1effc;
  display: grid;
  place-items: center;
  font-weight: bold;
}

.question-box {
  padding: 28px;
  min-height: 170px;
  border-radius: 14px;
  background: #edf6ff;
  border: 1px solid #d4e8f8;
  display: flex;
  align-items: center;
}

#question {
  font-size: 24px;
  font-weight: 600;
  line-height: 1.9;
  overflow-wrap: anywhere;
}

.record-area {
  text-align: center;
  margin-top: 34px;
}

.timer {
  margin: 16px 0;
  font-variant-numeric: tabular-nums;
  font-weight: bold;
}

button {
  padding: 12px 24px;
  border-radius: 10px;
  border: none;
  cursor: pointer;
}

button:disabled {
  opacity: .45;
  cursor: not-allowed;
}

button:focus-visible,
summary:focus-visible {
  outline: 3px solid #84bce7;
  outline-offset: 4px;
}

.record-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 12px;
  background: #176aa8;
  color: white;
  min-width: 260px;
}

.record-btn.recording { background: #c43a4a; }

.record-icon {
  width: 18px;
  height: 18px;
  border-radius: 50%;
  background: white;
}

.recording .record-icon { border-radius: 3px; }

#status {
  margin-top: 18px;
  min-height: 42px;
  color: #657b8c;
}

.waves {
  height: 52px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 7px;
  margin: 18px 0;
}

.waves span {
  width: 6px;
  height: 8px;
  border-radius: 5px;
  background: #b8d3e8;
}

.waves.active span {
  background: #cf5361;
  animation: wave .8s ease-in-out infinite alternate;
  animation-delay: calc(var(--i) * -.09s);
}

@keyframes wave {
  from { height: 8px; }
  to { height: 44px; }
}

audio {
  display: block;
  width: min(100%, 500px);
  margin: 18px auto 0;
}

.navigation {
  display: flex;
  justify-content: space-between;
  gap: 14px;
  margin-top: 32px;
}

.secondary {
  background: #e5eff8;
  color: #245d87;
}

.primary {
  background: #176aa8;
  color: white;
}

details {
  margin-top: 24px;
  color: #667e91;
}

summary { cursor: pointer; }

.mode-buttons {
  display: flex;
  gap: 12px;
  flex-wrap: wrap;
  margin-top: 14px;
}

.mode-buttons button[aria-pressed="true"] {
  outline: 2px solid #287cb7;
  background: #e2f1fc;
}

#finished {
  text-align: center;
  padding: 50px 28px;
}

#finished h2 { margin-bottom: 18px; }
#finished button { margin-top: 28px; }

[hidden] { display: none !important; }

@media (max-width: 600px) {
  main { padding: 22px 12px; }
  .card { padding: 22px 16px; }
  .question-box { padding: 20px; }
  .navigation { flex-wrap: wrap; }
  .navigation button { flex: 1; }
  .record-btn { min-width: 0; width: 100%; }
}

@media (prefers-reduced-motion: reduce) {
  .waves.active span {
    animation: none;
    height: 28px;
  }
  #progressBar { transition: none; }
}
</style>
</head>

<body>
<main>
  <header>
    <h1>玩家咨询</h1>
    <span class="badge" id="step">第1题 / 共6题</span>
  </header>

  <div class="progress" aria-hidden="true">
    <div id="progressBar"></div>
  </div>

  <section class="card" id="practice">
    <div class="player">
      <div class="avatar" aria-hidden="true">P</div>
      <span>プレイヤーからの質問</span>
    </div>

    <div class="question-box" aria-live="polite">
      <p id="question" lang="ja"></p>
    </div>

    <div class="record-area">
      <span class="badge" id="modeBadge">麦克风录音</span>

      <div class="waves" id="waves" aria-hidden="true">
        <span style="--i:1"></span>
        <span style="--i:2"></span>
        <span style="--i:3"></span>
        <span style="--i:4"></span>
        <span style="--i:5"></span>
        <span style="--i:6"></span>
        <span style="--i:7"></span>
        <span style="--i:8"></span>
        <span style="--i:9"></span>
        <span style="--i:10"></span>
        <span style="--i:11"></span>
      </div>

      <div class="timer" id="timer">00:00</div>

      <button class="record-btn" id="recordBtn" type="button">
        <span class="record-icon" aria-hidden="true"></span>
        <span id="recordLabel">点击开始录音</span>
      </button>

      <p id="status" role="status" aria-live="polite"></p>

      <audio id="playback" controls hidden></audio>
    </div>

    <nav class="navigation" aria-label="题目切换">
      <button class="secondary" id="previous" type="button">
        上一题
      </button>
      <button class="primary" id="next" type="button">
        下一题
      </button>
    </nav>

    <details id="settings">
      <summary>录音模式</summary>
      <div class="mode-buttons">
        <button
          class="secondary"
          id="realMode"
          type="button"
          aria-pressed="true">
          麦克风录音
        </button>
        <button
          class="secondary"
          id="demoMode"
          type="button"
          aria-pressed="false">
          模拟录音效果
        </button>
      </div>
    </details>
  </section>

  <section class="card" id="finished" hidden>
    <h2>本轮咨询结束</h2>
    <p id="completionText"></p>
    <button class="primary" id="restart" type="button">
      返回第一题复习
    </button>
  </section>
</main>

<script>
"use strict";

const questions = [
  "A．このイベントはいつからですか。",
  "B．このイベントはいつまでですか。",
  "C．冒険ランク1でも参加できますか。",
  "D．どんな報酬がもらえますか。",
  "E．報酬はどうやって受け取りますか。",
  "F．報酬メールの有効期限はどのくらいですか。"
];

const $ = id => document.getElementById(id);
const answers = questions.map(() => null);

let index = 0;
let mode = "real";
let recording = false;
let busy = false;
let recorder = null;

/*
  麦克风流在当前页面内复用。
  每题停止时仅停止MediaRecorder，不关闭麦克风流；
  非录音期间禁用音轨，下一题重新启用。
*/
let microphoneStream = null;
let microphoneRequest = null;
let clock = null;
let startTime = 0;
let leavingPage = false;

function formatTime(seconds) {
  const m = String(Math.floor(seconds / 60)).padStart(2, "0");
  const s = String(seconds % 60).padStart(2, "0");
  return m + ":" + s;
}

function hasLiveMicrophone() {
  return microphoneStream &&
    microphoneStream.getAudioTracks().some(
      track => track.readyState === "live"
    );
}

function enableMicrophone(enabled) {
  if (!microphoneStream) return;
  microphoneStream.getAudioTracks().forEach(track => {
    track.enabled = enabled;
  });
}

async function getMicrophone() {
  if (hasLiveMicrophone()) return microphoneStream;

  if (!navigator.mediaDevices ||
      !navigator.mediaDevices.getUserMedia ||
      !window.MediaRecorder) {
    throw new Error("unsupported");
  }

  if (!microphoneRequest) {
    microphoneRequest = navigator.mediaDevices.getUserMedia({
      audio: true
    });
  }

  try {
    const acquired = await microphoneRequest;

    if (leavingPage) {
      acquired.getTracks().forEach(track => track.stop());
      throw new Error("page-closed");
    }

    microphoneStream = acquired;
    return microphoneStream;
  } finally {
    microphoneRequest = null;
  }
}

function updateControls() {
  $("previous").disabled = recording || busy || index === 0;
  $("next").disabled = recording || busy;
  $("realMode").disabled = recording || busy;
  $("demoMode").disabled = recording || busy;
  $("recordBtn").disabled = busy;

  $("recordBtn").classList.toggle("recording", recording);
  $("waves").classList.toggle("active", recording);

  $("recordLabel").textContent = recording
    ? "停止录音"
    : mode === "demo"
      ? "开始模拟录音"
      : "点击开始录音";

  $("modeBadge").textContent = mode === "real"
    ? "麦克风录音"
    : "模拟录音";

  $("realMode").setAttribute(
    "aria-pressed", String(mode === "real")
  );
  $("demoMode").setAttribute(
    "aria-pressed", String(mode === "demo")
  );
}

function showQuestion() {
  $("playback").pause();
  $("playback").removeAttribute("src");
  $("playback").load();
  $("playback").hidden = true;

  $("question").textContent = questions[index];
  $("step").textContent = `第${index + 1}题 / 共6题`;
  $("progressBar").style.width =
    ((index + 1) / questions.length * 100) + "%";

  $("next").textContent =
    index === questions.length - 1 ? "完成本轮" : "下一题";

  const answer = answers[index];

  $("timer").textContent =
    formatTime(answer ? answer.seconds : 0);

  if (answer && answer.url) {
    $("playback").src = answer.url;
    $("playback").hidden = false;
    $("status").textContent = "录音已完成，可回放或重新录制。";
  } else if (answer && answer.demo) {
    $("status").textContent = "模拟录音已结束。";
  } else {
    $("status").textContent = "";
  }

  updateControls();
}

function beginTimer() {
  clearInterval(clock);
  startTime = Date.now();
  $("timer").textContent = "00:00";

  clock = setInterval(() => {
    $("timer").textContent = formatTime(
      Math.floor((Date.now() - startTime) / 1000)
    );
  }, 250);
}

function saveAnswer(questionIndex, answer) {
  const oldAnswer = answers[questionIndex];
  if (oldAnswer && oldAnswer.url) {
    URL.revokeObjectURL(oldAnswer.url);
  }
  answers[questionIndex] = answer;
}

async function startRecording() {
  $("playback").pause();

  if (mode === "demo") {
    recording = true;
    beginTimer();
    $("playback").hidden = true;
    $("status").textContent = "模拟录音中……";
    updateControls();
    return;
  }

  busy = true;
  updateControls();

  $("status").textContent = hasLiveMicrophone()
    ? ""
    : "正在连接麦克风……";

  try {
    const stream = await getMicrophone();
    enableMicrophone(true);

    const currentRecorder = new MediaRecorder(stream);
    const questionIndex = index;
    const chunks = [];
    let failed = false;
    let stoppedAt = null;

    recorder = currentRecorder;

    currentRecorder.addEventListener("dataavailable", event => {
      if (event.data.size > 0) chunks.push(event.data);
    });

    currentRecorder.addEventListener("error", () => {
      failed = true;
      clearInterval(clock);
      recording = false;
      busy = false;
      enableMicrophone(false);
      $("status").textContent = "录音发生异常，请重新尝试。";
      updateControls();
    });

    currentRecorder.addEventListener("stop", () => {
      clearInterval(clock);
      recording = false;
      busy = false;
      enableMicrophone(false);

      if (leavingPage) return;

      const seconds = Math.max(
        0,
        Math.floor(((stoppedAt || Date.now()) - startTime) / 1000)
      );

      if (!failed && chunks.length) {
        const blob = new Blob(chunks, {
          type: currentRecorder.mimeType || chunks[0].type
        });

        saveAnswer(questionIndex, {
          url: URL.createObjectURL(blob),
          seconds,
          demo: false
        });

        showQuestion();
      } else {
        $("status").textContent = "未获得有效录音，请重新尝试。";
        updateControls();
      }

      recorder = null;
    });

    currentRecorder.markStopTime = () => {
      stoppedAt = Date.now();
    };

    currentRecorder.start();
    recording = true;
    busy = false;
    beginTimer();

    $("playback").hidden = true;
    $("status").textContent = "正在录音……";
    updateControls();

  } catch (error) {
    enableMicrophone(false);
    recording = false;
    busy = false;
    recorder = null;

    if (leavingPage) return;

    $("settings").open = true;
    $("status").textContent =
      "麦克风不可用，请检查权限，或选择模拟录音。";
    updateControls();
  }
}

function stopRecording() {
  clearInterval(clock);

  if (mode === "demo") {
    saveAnswer(index, {
      demo: true,
      seconds: Math.floor((Date.now() - startTime) / 1000),
      url: null
    });

    recording = false;
    showQuestion();
    return;
  }

  if (recorder && recorder.state !== "inactive") {
    busy = true;
    updateControls();
    $("status").textContent = "正在保存录音……";

    recorder.markStopTime();
    recorder.stop();
    enableMicrophone(false);
  }
}

$("recordBtn").addEventListener("click", () => {
  if (busy) return;
  if (recording) stopRecording();
  else startRecording();
});

$("previous").addEventListener("click", () => {
  if (recording || busy || index === 0) return;
  index--;
  showQuestion();
});

$("next").addEventListener("click", () => {
  if (recording || busy) return;

  if (index < questions.length - 1) {
    index++;
    showQuestion();
  } else {
    $("playback").pause();
    $("practice").hidden = true;
    $("finished").hidden = false;
    $("step").textContent = "本轮结束";

    const realCount = answers.filter(a => a && a.url).length;
    const demoCount = answers.filter(a => a && a.demo).length;

    $("completionText").textContent =
      `共6道咨询题，已录制${realCount}题，模拟操作${demoCount}题。`;
  }
});

$("restart").addEventListener("click", () => {
  index = 0;
  $("practice").hidden = false;
  $("finished").hidden = true;
  showQuestion();
});

function setMode(nextMode) {
  if (recording || busy) return;
  mode = nextMode;
  enableMicrophone(false);
  $("status").textContent = "";
  updateControls();
}

$("realMode").addEventListener("click", () => {
  setMode("real");
});

$("demoMode").addEventListener("click", () => {
  setMode("demo");
});

/* 离开页面时释放麦克风 */
window.addEventListener("pagehide", () => {
  leavingPage = true;
  clearInterval(clock);

  if (recorder && recorder.state !== "inactive") {
    recorder.stop();
  }

  if (microphoneStream) {
    microphoneStream.getTracks().forEach(track => track.stop());
    microphoneStream = null;
  }
});

/* 从浏览器返回缓存恢复页面时，重置操作状态 */
window.addEventListener("pageshow", event => {
  leavingPage = false;
  if (event.persisted) {
    recording = false;
    busy = false;
    recorder = null;
    showQuestion();
  }
});

showQuestion();
</script>
</body>
</html>
